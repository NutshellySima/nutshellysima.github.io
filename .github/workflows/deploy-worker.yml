name: Deploy Cloudflare Worker

# GitHub Pages stays the static origin; this worker adds edge-only agent
# discovery (Link headers, markdown negotiation, /.well-known/api-catalog).
on:
  push:
    branches: [main]
    paths:
      - cloudflare/**
      - wrangler.toml
      - .well-known/agent-skills/**
      - scripts/check-agent-sync.js
      - scripts/check-worker.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Refuse to publish if the embedded SKILL.md drifted or the worker's own
      # responses (apex redirect, api-catalog, skills digest) regressed.
      - name: Check worker
        run: npm run check

      - name: Deploy worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
